<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aditi ✨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Sparkle/Glitter background effect */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: twinkle 1.5s infinite ease-in-out;
            box-shadow: 0 0 10px #fff, 0 0 20px #ff69b4;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            z-index: 10;
            animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #d63384;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        .btn:hover {
            background-color: #ff1e42;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Sparkles generation -->
    <script>
        for (let i = 0; i < 40; i++) {
            let spark = document.createElement('div');
            spark.className = 'sparkle';
            spark.style.top = Math.random() * window.innerHeight + 'px';
            spark.style.left = Math.random() * window.innerWidth + 'px';
            spark.style.animationDelay = (Math.random() * 2) + 's';
            document.body.appendChild(spark);
        }
    </script>

    <div class="card" id="cardBox">
        <h1 id="cardTitle">Hey Aditi... ✨</h1>
        <p id="cardText">I built this little surprise just for you because some things have been sitting on my heart for a while now.</p>
        <button class="btn" id="nextBtn" onclick="nextStep()">Open Surprise 💕</button>
    </div>

    <script>
        let step = 1;

        function nextStep() {
            const title = document.getElementById("cardTitle");
            const text = document.getElementById("cardText");
            const btn = document.getElementById("nextBtn");

            if (step === 1) {
                title.innerText = "Aditi... 💖";
                text.innerText = "I love you. More than just words can say, and more than I ever planned to. You make my days brighter just by being in them.";
                btn.innerText = "Next ✨";
                step++;
            } else if (step === 2) {
                title.innerText = "Thank You 🌸";
                text.innerText = "Thank you for giving me your friendship and for sharing so many wonderful moments with me. It means the world to me.";
                btn.innerText = "One last thing... 🤭";
                step++;
            } else if (step === 3) {
                title.innerText = "And Most Importantly... 👑";
                text.innerText = "Thank you so much for tolerating this absolute idiot all this time! You have the patience of a saint, and I'm so lucky to have you. 💫";
                btn.innerText = "Forever & Always 💖";
                step++;
            } else {
                alert("You're the best, Aditi! 🥰✨");
                location.reload();
            }
        }
    </script>

</body>
</html>
